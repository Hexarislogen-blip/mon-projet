  <rect x="140" y="105" width="100" height="45" rx="4" fill="#ffffff"/>
  <text x="150" y="120" fill="#000000" font-family="Arial" font-size="9" font-weight="bold">XSS</text>
  <text x="150" y="132" fill="#666666" font-family="Arial" font-size="8">• Reflected</text>
  <text x="150" y="143" fill="#666666" font-family="Arial" font-size="8">• Stored</text>
  
  <rect x="250" y="105" width="100" height="45" rx="4" fill="#ffffff"/>
  <text x="260" y="120" fill="#000000" font-family="Arial" font-size="9" font-weight="bold">File Upload</text>
  <text x="260" y="132" fill="#666666" font-family="Arial" font-size="8">• Webshell</text>
