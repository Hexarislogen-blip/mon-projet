  <!-- Main Interface -->
  <rect x="20" y="50" width="360" height="180" rx="8" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
  
  <!-- GitHub Repository -->
  <rect x="30" y="60" width="340" height="35" rx="4" fill="#ffffff"/>
  <text x="40" y="75" fill="#000000" font-family="monospace" font-size="10">📁 swisskyrepo/PayloadsAllTheThings</text>
  <text x="40" y="88" fill="#666666" font-family="Arial" font-size="8">⭐ 45.2k stars | 🍴 8.1k forks</text>
  
