<svg width="400" height="250" viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <!-- Background noir et blanc -->
  <rect width="400" height="250" fill="#0a0a0a"/>
  
  <!-- Header -->
  <text x="20" y="30" fill="#ffffff" font-family="Arial, sans-serif" font-size="18" font-weight="bold">FluxDev SaaS Platform</text>
  
  <!-- Main Dashboard -->
  <rect x="20" y="50" width="360" height="180" rx="8" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
  
  <!-- Project Pipeline -->
  <rect x="30" y="60" width="340" height="30" rx="4" fill="#2a2a2a"/>
  <text x="40" y="80" fill="#ffffff" font-family="monospace" font-size="11">Pipeline: Code → Build → Test → Deploy</text>
  
  <!-- Development Modules -->
  <rect x="30" y="100" width="100" height="60" rx="4" fill="#ffffff"/>
  <text x="40" y="120" fill="#000000" font-family="Arial" font-size="10" font-weight="bold">Code Editor</text>
  <text x="40" y="135" fill="#666666" font-family="Arial" font-size="9">• IntelliSense</text>
  <text x="40" y="150" fill="#666666" font-family="Arial" font-size="9">• Git Integration</text>
  
  <rect x="140" y="100" width="100" height="60" rx="4" fill="#ffffff"/>
  <text x="150" y="120" fill="#000000" font-family="Arial" font-size="10" font-weight="bold">CI/CD</text>
  <text x="150" y="135" fill="#666666" font-family="Arial" font-size="9">• Auto Build</text>
  <text x="150" y="150" fill="#666666" font-family="Arial" font-size="9">• Deploy</text>
  
  <rect x="250" y="100" width="100" height="60" rx="4" fill="#ffffff"/>
  <text x="260" y="120" fill="#000000" font-family="Arial" font-size="10" font-weight="bold">Monitoring</text>
  <text x="260" y="135" fill="#666666" font-family="Arial" font-size="9">• Analytics</text>
  <text x="260" y="150" fill="#666666" font-family="Arial" font-size="9">• Alerts</text>
  
  <!-- Collaboration Hub -->
  <rect x="30" y="170" width="340" height="50" rx="4" fill="#ffffff"/>
  <text x="40" y="190" fill="#000000" font-family="Arial" font-size="10" font-weight="bold">Team Collaboration</text>
  <text x="40" y="205" fill="#666666" font-family="Arial" font-size="9">• Code Reviews • Task Management • Real-time Chat</text>
  
  <!-- Connection arrows -->
  <path d="M 130 130 L 140 130" stroke="#ffffff" stroke-width="2" fill="none"/>
  <path d="M 240 130 L 250 130" stroke="#ffffff" stroke-width="2" fill="none"/>
  
  <!-- Status indicators -->
  <circle cx="350" cy="80" r="5" fill="#ffffff"/>
  <text x="340" y="85" fill="#ffffff" font-family="Arial" font-size="8">Live</text>
</svg>
