<svg width="400" height="250" viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <!-- Background noir et blanc -->
  <rect width="400" height="250" fill="#0a0a0a"/>
  
  <!-- Header -->
  <text x="20" y="30" fill="#ffffff" font-family="Arial, sans-serif" font-size="18" font-weight="bold">JWT Toolkit Analyzer</text>
  
  <!-- Main Interface -->
  <rect x="20" y="50" width="360" height="180" rx="8" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
  
  <!-- Input Token -->
  <rect x="30" y="60" width="340" height="40" rx="4" fill="#2a2a2a"/>
  <text x="40" y="75" fill="#ffffff" font-family="monospace" font-size="10">eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...</text>
  <text x="40" y="90" fill="#888" font-family="Arial" font-size="8">Paste JWT Token Here</text>
  
  <!-- Analysis Results -->
  <rect x="30" y="110" width="160" height="50" rx="4" fill="#ffffff"/>
  <text x="40" y="125" fill="#000000" font-family="Arial" font-size="10" font-weight="bold">🚨 VULNERABILITIES</text>
  <text x="40" y="140" fill="#000000" font-family="Arial" font-size="9">• Algorithm: HS256 (Weak)</text>
  <text x="40" y="155" fill="#000000" font-family="Arial" font-size="9">• No expiration check</text>
  
  <rect x="200" y="110" width="170" height="50" rx="4" fill="#ffffff"/>
  <text x="210" y="125" fill="#000000" font-family="Arial" font-size="10" font-weight="bold">✓ TOKEN INFO</text>
  <text x="210" y="140" fill="#666666" font-family="Arial" font-size="9">• Header: {"alg":"HS256","typ":"JWT"}</text>
  <text x="210" y="155" fill="#666666" font-family="Arial" font-size="9">• Size: 247 bytes</text>
  
  <!-- Payload Decoded -->
  <rect x="30" y="170" width="340" height="50" rx="4" fill="#ffffff"/>
  <text x="40" y="185" fill="#000000" font-family="Arial" font-size="10" font-weight="bold">PAYLOAD DECODED</text>
  <text x="40" y="200" fill="#666666" font-family="monospace" font-size="8">{"user":"admin","role":"superuser","exp":1672531200}</text>
  <text x="40" y="212" fill="#666666" font-family="Arial" font-size="8">⚠ Expired: Token should be rejected</text>
  
  <!-- Security Score -->
  <circle cx="350" cy="80" r="20" fill="#ffffff"/>
  <text x="340" y="85" fill="#000000" font-family="Arial" font-size="12" font-weight="bold">3/10</text>
</svg>
