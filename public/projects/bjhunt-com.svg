<svg width="400" height="250" viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <!-- Background noir et blanc -->
  <rect width="400" height="250" fill="#0a0a0a"/>
  
  <!-- Header -->
  <text x="20" y="30" fill="#ffffff" font-family="Arial, sans-serif" font-size="18" font-weight="bold">BJHUNT IA Interface</text>
  
  <!-- Chat Interface -->
  <rect x="20" y="50" width="360" height="180" rx="8" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
  
  <!-- User Prompt -->
  <rect x="30" y="60" width="340" height="40" rx="6" fill="#2a2a2a"/>
  <text x="40" y="85" fill="#ffffff" font-family="monospace" font-size="12">"Audit sécurité site ecommerce.com"</text>
  
  <!-- AI Processing -->
  <circle cx="200" cy="120" r="15" fill="#ffffff"/>
  <text x="195" y="125" fill="#000000" font-family="Arial" font-size="10" font-weight="bold">IA</text>
  
  <!-- Tools Orchestration -->
  <rect x="40" y="145" width="80" height="25" rx="4" fill="#ffffff"/>
  <text x="45" y="162" fill="#000000" font-family="Arial" font-size="9" font-weight="bold">OWASP Scan</text>
  
  <rect x="130" y="145" width="80" height="25" rx="4" fill="#ffffff"/>
  <text x="135" y="162" fill="#000000" font-family="Arial" font-size="9" font-weight="bold">PCI-DSS Check</text>
  
  <rect x="220" y="145" width="80" height="25" rx="4" fill="#ffffff"/>
  <text x="225" y="162" fill="#000000" font-family="Arial" font-size="9" font-weight="bold">ISO 27001</text>
  
  <rect x="310" y="145" width="50" height="25" rx="4" fill="#ffffff"/>
  <text x="315" y="162" fill="#000000" font-family="Arial" font-size="9" font-weight="bold">+314</text>
  
  <!-- Results -->
  <rect x="30" y="180" width="340" height="40" rx="6" fill="#1a1a1a"/>
  <text x="40" y="195" fill="#ffffff" font-family="monospace" font-size="10">⚠ 3 vulnérabilités critiques détectées</text>
  <text x="40" y="210" fill="#ffffff" font-family="monospace" font-size="10">✓ 97% conformité OWASP</text>
  
  <!-- Connection lines -->
  <line x1="200" y1="105" x2="80" y2="145" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
  <line x1="200" y1="105" x2="170" y2="145" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
  <line x1="200" y1="105" x2="260" y2="145" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
  <line x1="200" y1="105" x2="335" y2="145" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
</svg>
